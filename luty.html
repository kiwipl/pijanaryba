<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pijana Ryba - Luty</title>
    <style>
        /* Reset marginesów i paddingów */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Stylowanie body */
        body {
            background-color: #121212;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #e0e0e0;
            overflow: hidden;
            position: relative;
        }

        /* Kontener główny */
        .container {
            max-width: 800px;
            width: 90%;
            padding: 20px;
            background-color: rgba(30, 30, 30, 0.8);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            position: relative;
            z-index: 2;
            text-align: center;
        }

        /* Ryby */
        .fish {
            font-size: 24px;
            color: #76c7c0;
            position: absolute;
            white-space: nowrap;
            animation: swim 8s linear infinite;
            filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.5));
            z-index: 1;
        }

        .fish:nth-child(2) {
            font-size: 20px;
            color: #ff6b6b;
            animation-duration: 9s;
            animation-delay: -3s;
            top: 30%;
        }

        .fish:nth-child(3) {
            font-size: 16px;
            color: #f8e71c;
            animation-duration: 7s;
            animation-delay: -6s;
            top: 70%;
        }

        .fish:nth-child(4) {
            font-size: 28px;
            color: #50e3c2;
            animation-duration: 10s;
            animation-delay: -9s;
            top: 40%;
        }

        .fish:nth-child(5) {
            font-size: 22px;
            color: #7ed321;
            animation-duration: 6s;
            animation-delay: -2s;
            top: 60%;
        }

        @keyframes swim {
            0% {
                left: -10%;
                transform: scaleX(1);
            }
            50% {
                left: 110%;
                transform: scaleX(1);
            }
            50.01% {
                transform: scaleX(-1);
            }
            100% {
                left: -10%;
                transform: scaleX(-1);
            }
        }

        /* Bąbelki */
        .bubble {
            position: absolute;
            bottom: -50px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            animation: rise 5s infinite;
            opacity: 0.8;
            z-index: 1;
        }

        .bubble:nth-child(6) {
            width: 10px;
            height: 10px;
            left: 20%;
            animation-duration: 7s;
            animation-delay: -2s;
        }

        .bubble:nth-child(7) {
            width: 15px;
            height: 15px;
            left: 50%;
            animation-duration: 5s;
            animation-delay: -3s;
        }

        .bubble:nth-child(8) {
            width: 8px;
            height: 8px;
            left: 80%;
            animation-duration: 6s;
            animation-delay: -1s;
        }

        @keyframes rise {
            0% {
                bottom: -50px;
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                bottom: 100%;
                opacity: 0;
            }
        }

        /* Nagłówek */
        h1 {
            font-size: 48px;
            color: #76c7c0;
            margin-bottom: 20px;
        }

        /* Paragraf */
        p {
            font-size: 18px;
            color: #e0e0e0;
            line-height: 1.6;
        }

        /* Płatki śniegu */
        .snowflake {
            position: absolute;
            top: -10%;
            color: #fff;
            font-size: 20px;
            animation: fall linear infinite;
            z-index: 1;
            user-select: none;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) translateX(0);
            }
            100% {
                transform: translateY(110vh) translateX(50vw);
            }
        }

        /* Serca */
        .heart {
            position: absolute;
            color: #ff6b6b;
            font-size: 24px;
            animation: float 6s ease-in-out infinite;
            z-index: 1;
            user-select: none;
        }

        @keyframes float {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) translateX(10px) rotate(10deg);
            }
            100% {
                transform: translateY(0) translateX(0) rotate(0deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="fish">><(((('></div>
        <div class="fish">><(((('></div>
        <div class="fish">><(((('></div>
        <div class="fish">><(((('></div>
        <div class="fish">><(((('></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <h1>Pijana Ryba</h1>
        <p>"Pijana rybo! Ojczyzno moja! Ty jesteś jak wódka, Ile cię trzeba pić, ten tylko się dowie, Kto cię wypił. Dziś smak twój w całej ostrości Widzę i opisuję, bo tęsknię po tobie."</p>
    </div>

    <!-- Płatki śniegu -->
    <div class="snowflake" style="left: 5%; animation-duration: 8s;">❅</div>
    <div class="snowflake" style="left: 15%; animation-duration: 10s;">❆</div>
    <div class="snowflake" style="left: 25%; animation-duration: 12s;">❅</div>
    <div class="snowflake" style="left: 35%; animation-duration: 9s;">❆</div>
    <div class="snowflake" style="left: 45%; animation-duration: 11s;">❅</div>
    <div class="snowflake" style="left: 55%; animation-duration: 7s;">❆</div>
    <div class="snowflake" style="left: 65%; animation-duration: 8s;">❅</div>
    <div class="snowflake" style="left: 75%; animation-duration: 10s;">❆</div>
    <div class="snowflake" style="left: 85%; animation-duration: 9s;">❅</div>
    <div class="snowflake" style="left: 95%; animation-duration: 12s;">❆</div>

    <!-- Serca -->
    <div class="heart" style="top: 10%; left: 10%; animation-duration: 5s;">❤️</div>
    <div class="heart" style="top: 20%; left: 80%; animation-duration: 6s;">❤️</div>
    <div class="heart" style="top: 30%; left: 20%; animation-duration: 7s;">❤️</div>
    <div class="heart" style="top: 40%; left: 70%; animation-duration: 8s;">❤️</div>
    <div class="heart" style="top: 50%; left: 30%; animation-duration: 9s;">❤️</div>
</body>
</html>
